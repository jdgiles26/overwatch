services:
  fabric:
    build:
      context: ..
      dockerfile: infra/Dockerfile.fabric
    ports:
      - "4311:4311"
    environment:
      FABRIC_PORT: "4311"
      OVERWATCH_DB: /data/overwatch.db
      OVERWATCH_KEY_PATH: /data/key.bin
    volumes:
      - overwatch_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:4311/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        # Bake at build time — Next.js inlines NEXT_PUBLIC_* into the bundle
        NEXT_PUBLIC_FABRIC_URL: ${NEXT_PUBLIC_FABRIC_URL:-http://localhost:4311}
        NEXT_PUBLIC_FABRIC_WS: ${NEXT_PUBLIC_FABRIC_WS:-ws://localhost:4311}
        NEXT_PUBLIC_GO2RTC_URL: ${NEXT_PUBLIC_GO2RTC_URL:-http://localhost:1984}
    ports:
      - "3311:3311"
    environment:
      FABRIC_URL: http://fabric:4311
    depends_on:
      fabric:
        condition: service_healthy
    restart: unless-stopped

  go2rtc:
    image: alexxit/go2rtc:latest
    # `network_mode: host` is silently ignored on macOS / Docker Desktop,
    # which made the previous compose unusable on developer laptops.
    # Publish the documented ports explicitly so the README claim holds
    # on every host OS.
    ports:
      - "1984:1984"     # HTTP API + WHEP
      - "8555:8555/tcp" # WebRTC TCP
      - "8555:8555/udp" # WebRTC UDP
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    restart: unless-stopped

volumes:
  overwatch_data:
